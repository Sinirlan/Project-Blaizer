// REMASTER #494 phase 3, retuned for #496: each car's engine character for the Enhanced engine sound (built into the game).
//   carNN pitch low_db high_db level_db body_db air_db
// pitch multiplies the engine's pitch (1 = the game's), low_db / high_db are the gains of the low / high shelf
// (corners TONE_LOW_HZ / TONE_HIGH_HZ, F11 Audio/Enhanced), level_db the engine's level, body_db / air_db are added to
// BODY_DB / AIR_DB (the octave-down body and the combustion air of the car you hear). A car without a line sounds as the
// game's. CHARACTER (F11) scales every offset.
// Two axes: strength follows the engine power estimate of docs/car-stats.md (mean of the two estimates, kW below:
// level, body, low shelf), the engine type follows the characters approved for #81 (pitch, rasp, air). Tuned by ear.
// Resonic ~205 kW: the weakest, thin, quiet and plain
car08 1.05 -3.0  1.0 -2.5 -12 -3
// Adder Mk2 ~230 kW: entry division, flat-4 grumble, dull
car02 0.95  0.5 -2.0 -1.5  -6 -3
// ASC II ~234 kW: smooth I6, little air
car05 1.02  0.0 -1.5 -1.0  -3 -5
// ASC ~240 kW: inline 5, plain
car07 1.00  0.5  0.5 -1.0  -4 -1
// R-Build 2 ~252 kW: odd-fire V6, rough
car09 0.94  1.5  1.5 -0.5  -2  1
// Python V12 ~272 kW: a V12 scream
car03 1.12 -2.0  4.0  0.0  -3  1
// Kobra X3 ~288 kW: agile, high-revving I4, rasp
car01 1.07 -1.0  3.0  0.5   0  3
// Avalanche ~294 kW: heavy V8, deep
car06 0.87  4.5 -2.5  1.0   4 -1
// Titan ~316 kW: high-revving V12 supercar, bright and edged (#515: was a heavy V8, 0.90 / 4 / -1 / 1.5 / 5 / 1; picked by ear)
car10 1.15 -1.0  4.5  1.5   0  3
// Serpent ~370 kW: V10, the loudest and fullest
car04 1.03  2.0  3.0  2.5   4  4
// Patch 3.0 cars (#365), APPROX: set by the two axes above without listening; tune by ear later.
// Dominator ~326 kW (ASC III): the ASC's smooth inline engine, a step below the Serpent
car11 1.01  1.0  0.5  1.8   4.5 -1
// Python Menace ~339 kW: the Python V12's scream with more power
car12 1.10 -1.0  4.0  2.0   4   2
// Venom ~371 kW (Kobra X4): the Kobra X3's rasp at the Serpent's strength
car13 1.05  1.0  3.0  2.4   3.5 3
// SuperBee ~285 kW, 1700 kg: a heavy, low, rumbling engine
car14 0.88  3.0 -1.0  0.5   2   0
