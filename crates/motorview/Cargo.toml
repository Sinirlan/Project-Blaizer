[package]
name = "motorview"
description = "Track/car viewer for Motorhead data (M1). Reads a user-supplied install."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
motor-tune = { path = "../motor-tune" }
motor-data = { path = "../motor-data" }
motor-version = { path = "../motor-version" }
wgpu = "30.0.1"
winit = "0.30.13"
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
motor-sim = { path = "../motor-sim" }
motor-audio = { path = "../motor-audio" }
gilrs = "0.11.2"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
font8x8 = { version = "0.3.1", default-features = false }
ttf-parser = "0.25.1"
png = "0.17"
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
lyon_tessellation = "1"
exr = "1.74.2"
half = "2.7.1"
miniz_oxide = "0.8.9"
# Lap Analysis (#429 phase 4): the system file dialog (same version and features as motorinstall)
rfd = "0.15"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }

[build-dependencies]
winresource = "0.1.34"
